[package]
name = "d2r-marketplace"
version = "0.1.0"
description = "D2R Marketplace - Offline Auction House for Diablo II: Resurrected"
authors = ["spectr4l"]
edition = "2024"
default-run = "d2r-marketplace"

[lib]
name = "d2r_marketplace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
shellexpand = "3"
which = "7"
memmap2 = "0.9"
memchr = "2.7"

zip = { version = "2", features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
opt-level = "z"
strip = true

[features]
# 默认关闭 — 仅在用户显式开启时才编译 mod stash 降级路径
# 用法: cargo build --features mod-stash-experimental
default = []
mod-stash-experimental = []
# 本地调试测试（硬编码绝对路径，不随 CI 构建）
# 用法: cargo test --features local-debug-tests
local-debug-tests = []
