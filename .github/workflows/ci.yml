name: CI

on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
permissions:
  contents: write  # release job 创建 GitHub Release 需要

jobs:
  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check
        run: cargo check --all-targets
      - name: Clippy (lib + bins)
        run: cargo clippy --lib --bins -- -D warnings
      - name: Test
        run: cargo test

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  release:
    needs: [rust, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2
      - name: Install frontend deps
        run: npm ci
        working-directory: web
      - name: Build Tauri
        # tauri script 定义在根 package.json (src-tauri 下没有 package.json)
        run: npm run build -- --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri requires a valid code signing certificate for production builds
          # For open source projects, consider osslsigncode or signtool
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2r-marketplace-msi
          path: src-tauri/target/release/bundle/msi/*.msi
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: d2r-marketplace-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
