name: Bug Report
description: Report a bug in D2R Marketplace
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report

  - type: input
    id: version
    attributes:
      label: D2R Patch Version
      description: "e.g. v2.5 (build 什么东西)"
    validations:
      required: true

  - type: dropdown
    id: stash_version
    attributes:
      label: Stash File Version
      options:
        - v96
        - v97
        - v98
        - v105
        - v111
        - Unknown
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      placeholder: "Clear and concise description of the bug"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: "1. \n2. \n3."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS Version
