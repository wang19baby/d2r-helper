name: Feature Request
description: Suggest a new feature for D2R Marketplace
labels: enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request

  - type: textarea
    id: problem
    attributes:
      label: Problem or Limitation
      placeholder: "What problem does this solve?"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      placeholder: "How would you solve it?"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
